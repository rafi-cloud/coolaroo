<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account — Coolaroo Restaurant &amp; Bistro</title>
<meta name="description" content="Create a Coolaroo account to book tables faster and track your order history.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="customer-pages.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="logo" href="index.html">
      <img src="images/logo.svg" alt="Coolaroo Restaurant">
      <span class="logo-text"><strong>COOLAROO</strong><span>RESTAURANT &amp; BISTRO</span></span>
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="index.html#menu">Menu</a>
      <a href="index.html#about">About</a>
      <a class="btn btn-orange" href="index.html#reserve">Book a table</a>
    </nav>
  </div>
</header>

<main class="auth">
  <div class="auth-card">
    <div class="auth-head">
      <img src="images/logo.svg" alt="">
      <h1>Create your account</h1>
      <p>Book tables faster and keep track of your orders</p>
    </div>

    <form id="registerForm" novalidate>
      <div class="auth-name-row">
        <div class="auth-field">
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" type="text" autocomplete="given-name" required>
        </div>
        <div class="auth-field">
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" type="text" autocomplete="family-name" required>
        </div>
      </div>

      <div class="auth-field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>

      <div class="auth-field">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="04xx xxx xxx" required>
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
      </div>

      <div class="auth-field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8">
      </div>

      <p class="auth-terms">
        By creating an account you agree to Coolaroo's
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </p>

      <button class="btn btn-orange" type="submit">Create account</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="account-login.html">Log in</a></p>
  </div>
</main>

<script>
  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('password').value;
    var cpw = document.getElementById('confirmPassword').value;
    if (pw !== cpw) {
      alert('Passwords don\'t match — please check and try again.');
      return;
    }
    alert('This is a static template. Registration will be connected once the Laravel back end is in place.');
  });
</script>

</body>
</html>
