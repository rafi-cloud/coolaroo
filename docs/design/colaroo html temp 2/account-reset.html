<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — Coolaroo Restaurant &amp; Bistro</title>
<meta name="description" content="Reset your Coolaroo account password.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="customer-pages.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="logo" href="index.html">
      <img src="images/logo.svg" alt="Coolaroo Restaurant">
      <span class="logo-text"><strong>COOLAROO</strong><span>RESTAURANT &amp; BISTRO</span></span>
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="index.html#menu">Menu</a>
      <a href="index.html#about">About</a>
      <a class="btn btn-orange" href="index.html#reserve">Book a table</a>
    </nav>
  </div>
</header>

<main class="auth">
  <div class="auth-card">
    <div class="auth-head">
      <img src="images/logo.svg" alt="">
      <h1>Reset your password</h1>
      <p>Enter your account email and we'll send you a link to choose a new one.</p>
    </div>

    <form id="resetForm" novalidate>
      <div class="auth-field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>

      <button class="btn btn-orange" type="submit">Send reset link</button>
    </form>

    <div class="auth-error" id="resetSent" role="status" style="display:none;background:#DDF2E5;border-color:#BFE6CE;color:#1F7844;margin-top:1.3rem;margin-bottom:0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
      <span>If that email matches an account, a reset link is on its way.</span>
    </div>

    <p class="auth-foot">Remembered it after all? <a href="account-login.html">Back to login</a></p>
  </div>
</main>

<script>
  document.getElementById('resetForm').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('resetSent').style.display = 'flex';
  });
</script>

</body>
</html>
