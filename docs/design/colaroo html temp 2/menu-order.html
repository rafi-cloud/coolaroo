<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your table's menu — Coolaroo Restaurant &amp; Bistro</title>
<meta name="description" content="Order straight from your table at Coolaroo — browse the menu and add items to your cart.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="customer-pages.css">
</head>
<body>

<header class="order-bar">
  <div class="wrap order-bar-inner">
    <a class="logo" href="index.html">
      <img src="images/logo.svg" alt="Coolaroo Restaurant">
      <span class="logo-text"><strong>COOLAROO</strong><span>RESTAURANT &amp; BISTRO</span></span>
    </a>
    <span class="table-chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/></svg>
      Table 12
    </span>
  </div>
</header>

<nav class="cat-tabs wrap" id="catTabs">
  <button class="cat-tab active" data-cat="all" type="button">All</button>
  <button class="cat-tab" data-cat="pizza" type="button">Pizza</button>
  <button class="cat-tab" data-cat="pasta" type="button">Pasta</button>
  <button class="cat-tab" data-cat="grill" type="button">From the grill</button>
  <button class="cat-tab" data-cat="seafood" type="button">Seafood</button>
  <button class="cat-tab" data-cat="salad" type="button">Salads</button>
  <button class="cat-tab" data-cat="dessert" type="button">Dessert</button>
  <button class="cat-tab" data-cat="drinks" type="button">Drinks</button>
</nav>

<main class="wrap">
  <div class="order-grid" id="orderGrid"><!-- cards injected by JS --></div>
</main>

<!-- Item detail modal (SC-05) -->
<div class="modal-scrim" id="itemModalScrim">
  <div class="item-modal">
    <div class="item-modal-wrap">
      <button class="item-modal-close" id="itemModalClose" aria-label="Close" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B1A10" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <img id="modalImg" src="" alt="">
    </div>
    <div class="item-modal-body">
      <h3 id="modalName"></h3>
      <p class="price" id="modalPrice"></p>
      <p class="desc" id="modalDesc"></p>

      <div class="qty-row">
        <label>Quantity</label>
        <div class="qty-control">
          <button class="qty-btn" id="qtyMinus" type="button" aria-label="Decrease quantity">&minus;</button>
          <span class="qty-num" id="qtyNum">1</span>
          <button class="qty-btn" id="qtyPlus" type="button" aria-label="Increase quantity">+</button>
        </div>
      </div>

      <div class="item-field">
        <label for="itemNote">Special request (optional)</label>
        <textarea id="itemNote" rows="2" placeholder="e.g. no onion, extra sauce on the side"></textarea>
      </div>

      <div class="item-modal-foot">
        <button class="btn btn-orange" id="addToCartBtn" type="button">
          <span>Add to cart</span>
          <span id="addToCartTotal">$0</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Floating cart bar -->
<div class="cart-bar" id="cartBar">
  <div class="wrap">
    <div class="cart-bar-inner">
      <span class="cart-bar-count"><strong id="cartCount">0</strong> items &middot; <strong id="cartTotal">$0</strong></span>
      <a class="btn btn-amber" href="cart.html">View cart</a>
    </div>
  </div>
</div>

<script>
(function () {
  var MENU = [
    { id: 'margherita', name: 'Margherita', price: 19, cat: 'pizza', img: 'images/dish-margherita.jpg', desc: 'San Marzano, fior di latte, basil' },
    { id: 'burger', name: 'Coolaroo Burger', price: 22, cat: 'grill', img: 'images/dish-burger.jpg', desc: 'Double beef, cheddar, pickles, secret sauce' },
    { id: 'fish', name: 'Market Fish', price: 34, cat: 'seafood', img: 'images/dish-fish.jpg', desc: 'Whole snapper, lemon, salsa verde' },
    { id: 'prawns', name: 'Garlic Prawns', price: 26, cat: 'seafood', img: 'images/dish-prawns.jpg', desc: 'Chilli, parsley, grilled sourdough' },
    { id: 'rigatoni', name: 'Rigatoni Rag\u00f9', price: 25, cat: 'pasta', img: 'images/dish-rigatoni.jpg', desc: 'Slow beef, tomato, pecorino' },
    { id: 'porterhouse', name: 'Porterhouse', price: 39, cat: 'grill', img: 'images/dish-porterhouse.jpg', desc: '300g grass-fed, duck-fat potatoes' },
    { id: 'tacos', name: 'Fish Tacos', price: 18, cat: 'seafood', img: 'images/dish-tacos.jpg', desc: 'Three per serve, slaw, chipotle mayo' },
    { id: 'garden-bowl', name: 'Garden Bowl', price: 16, cat: 'salad', img: 'images/dish-garden-bowl.jpg', desc: 'Leaves, tomato, avocado, seeds' },
    { id: 'cupcake', name: 'Vanilla Cupcake', price: 8, cat: 'dessert', img: 'images/dish-cupcake.jpg', desc: 'Buttercream, glac\u00e9 cherry' },
    { id: 'gelato', name: 'Triple Gelato', price: 11, cat: 'dessert', img: 'images/dish-gelato.jpg', desc: 'Pistachio, stracciatella, raspberry' },
    { id: 'donuts', name: 'Cinnamon Donuts', price: 9, cat: 'dessert', img: 'images/dish-donuts.jpg', desc: 'Six per bag, warm chocolate dip' },
    { id: 'espresso', name: 'Espresso', price: 4, cat: 'drinks', img: 'images/dish-espresso.jpg', desc: 'Local roast, single origin' }
  ];

  var grid = document.getElementById('orderGrid');
  var tabs = document.querySelectorAll('.cat-tab');
  var activeCat = 'all';

  function money(n) { return '$' + n.toFixed(0); }

  function render() {
    grid.innerHTML = '';
    MENU.filter(function (item) {
      return activeCat === 'all' || item.cat === activeCat;
    }).forEach(function (item) {
      var card = document.createElement('article');
      card.className = 'order-card';
      card.innerHTML =
        '<img src="' + item.img + '" alt="' + item.name + '">' +
        '<div class="order-card-body">' +
          '<div class="order-card-head"><h4>' + item.name + '</h4><span class="price">' + money(item.price) + '</span></div>' +
          '<p>' + item.desc + '</p>' +
        '</div>';
      card.addEventListener('click', function () { openModal(item); });
      grid.appendChild(card);
    });
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      activeCat = tab.getAttribute('data-cat');
      render();
    });
  });

  // ---- Item modal ----
  var scrim = document.getElementById('itemModalScrim');
  var qty = 1;
  var currentItem = null;

  function openModal(item) {
    currentItem = item;
    qty = 1;
    document.getElementById('modalImg').src = item.img;
    document.getElementById('modalImg').alt = item.name;
    document.getElementById('modalName').textContent = item.name;
    document.getElementById('modalPrice').textContent = money(item.price);
    document.getElementById('modalDesc').textContent = item.desc;
    document.getElementById('itemNote').value = '';
    updateQty();
    scrim.classList.add('open');
  }
  function closeModal() { scrim.classList.remove('open'); }

  function updateQty() {
    document.getElementById('qtyNum').textContent = qty;
    document.getElementById('addToCartTotal').textContent = money(currentItem.price * qty);
  }

  document.getElementById('itemModalClose').addEventListener('click', closeModal);
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeModal(); });
  document.getElementById('qtyMinus').addEventListener('click', function () { if (qty > 1) { qty--; updateQty(); } });
  document.getElementById('qtyPlus').addEventListener('click', function () { qty++; updateQty(); });

  // ---- Cart (persisted in localStorage so cart.html can read it) ----
  function getCart() {
    try { return JSON.parse(localStorage.getItem('coolaroo_cart') || '[]'); }
    catch (e) { return []; }
  }
  function setCart(cart) { localStorage.setItem('coolaroo_cart', JSON.stringify(cart)); }

  function updateCartBar() {
    var cart = getCart();
    var count = cart.reduce(function (n, i) { return n + i.qty; }, 0);
    var total = cart.reduce(function (n, i) { return n + i.qty * i.price; }, 0);
    document.getElementById('cartCount').textContent = count;
    document.getElementById('cartTotal').textContent = money(total);
    document.getElementById('cartBar').classList.toggle('show', count > 0);
  }

  document.getElementById('addToCartBtn').addEventListener('click', function () {
    var cart = getCart();
    cart.push({
      id: currentItem.id,
      name: currentItem.name,
      price: currentItem.price,
      qty: qty,
      note: document.getElementById('itemNote').value.trim()
    });
    setCart(cart);
    updateCartBar();
    closeModal();
  });

  render();
  updateCartBar();
})();
</script>

</body>
</html>
